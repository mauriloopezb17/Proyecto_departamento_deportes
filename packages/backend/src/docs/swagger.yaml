openapi: 3.0.0
info:
  title: API Departamento de Deportes UCB
  version: 1.0.0
  description: Documentación de endpoints del sistema de deportes

servers:
  - url: http://localhost:3001
    description: Servidor de desarrollo

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Auth
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: juan.perez@ucb.edu.bo
        password:
          type: string
          example: miPassword123

    RegisterBody:
      type: object
      required:
        [
          nombres,
          ape_paterno,
          fecha_nacimiento,
          celular,
          email,
          password,
          id_rol,
        ]
      properties:
        nombres:
          type: string
        ape_paterno:
          type: string
        ape_materno:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        celular:
          type: string
        email:
          type: string
        password:
          type: string
        id_rol:
          type: integer

    ForgotPasswordBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: juan.perez@ucb.edu.bo

    VerifyCodeBody:
      type: object
      required: [email, codigo]
      properties:
        email:
          type: string
          example: juan.perez@ucb.edu.bo
        codigo:
          type: string
          example: "123456"

    ResetPasswordBody:
      type: object
      required: [reset_token, nueva_password]
      properties:
        reset_token:
          type: string
        nueva_password:
          type: string
          minLength: 8

    # ── Noticias
    CreateNoticiaBody:
      type: object
      required: [titulo, contenido]
      properties:
        titulo:
          type: string
        contenido:
          type: object
          description: Contenido en formato editor.js (JSON)
        id_categoria_noticia:
          type: integer
        resumen:
          type: string
        publicado:
          type: boolean
          default: false
        imagenes:
          type: array
          items:
            type: string
        id_usuario_autor:
          type: integer

    UpdateNoticiaBody:
      type: object
      properties:
        titulo:
          type: string
        contenido:
          type: object
        id_categoria_noticia:
          type: integer
        resumen:
          type: string
        publicado:
          type: boolean
        imagenes:
          type: array
          items:
            type: string

    # ── Admin
    InscribirDeportistaBody:
      type: object
      required: [deportista, inscripcion]
      properties:
        deportista:
          type: object
          description: Datos del deportista a inscribir
        inscripcion:
          type: object
          description: Datos de la inscripción (disciplina, categoría, etc.)

    CrearUsuarioBody:
      type: object
      required:
        [nombres, ape_paterno, fecha_nacimiento, celular, ci, email, id_rol]
      properties:
        nombres:
          type: string
        ape_paterno:
          type: string
        fecha_nacimiento:
          type: string
          format: date
        celular:
          type: string
        ci:
          type: string
        email:
          type: string
        id_rol:
          type: integer
          description: 1=Administrador, 3=Delegado, 4=Deportista
        id_carrera:
          type: integer
          description: Obligatorio si id_rol = 3 (Delegado)
        gestion:
          type: integer
          description: Obligatorio si id_rol = 3 (Delegado)

    # ── Admin (Nuevos)
    RegistrarHorarioBody:
      type: object
      required:
        [
          id_espacio,
          id_disciplina,
          dia_semana,
          hora_inicio,
          hora_fin,
          id_entrenador,
        ]
      properties:
        id_espacio:
          type: integer
        id_disciplina:
          type: integer
        dia_semana:
          type: integer
          description: "1 (Lunes) a 7 (Domingo)"
          minimum: 1
          maximum: 7
        hora_inicio:
          type: string
          format: time
          example: "14:30:00"
        hora_fin:
          type: string
          format: time
          example: "16:00:00"
        id_entrenador:
          type: integer

    # ── Galeria
    CrearGaleriaBody:
      type: object
      required: [url_archivo, tipo_archivo]
      properties:
        url_archivo:
          type: string
        tipo_archivo:
          type: string
        descripcion:
          type: string
        publicado:
          type: boolean
          default: false

tags:
  - name: Auth
    description: Autenticación y gestión de acceso
  - name: Noticias
    description: Gestión de noticias y categorías
  - name: Admin
    description: Operaciones exclusivas del administrador
  - name: Upload
    description: Subida de imágenes
  - name: Partidos
    description: Resultados y fixtures de partidos
  - name: Deportistas
    description: Información pública de los deportistas
  - name: Galeria
    description: Gestión de la galería multimedia
  - name: Info
    description: Información pública del club (entrenadores, horarios, espacios)

paths:
  # ── Auth
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        200:
          description: Login exitoso, devuelve token JWT
        401:
          description: Credenciales inválidas

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        201:
          description: Usuario registrado exitosamente
        400:
          description: Faltan campos o el correo ya existe

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar código de recuperación de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        200:
          description: Si el correo existe, se envía el código al correo

  /api/auth/verify-reset-code:
    post:
      tags: [Auth]
      summary: Validar código de recuperación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeBody"
      responses:
        200:
          description: Código válido, devuelve reset_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  reset_token:
                    type: string
        400:
          description: Código inválido o expirado

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Cambiar contraseña con el reset_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        200:
          description: Contraseña actualizada correctamente
        400:
          description: Token inválido o expirado

  # ── Noticias
  /api/noticias:
    get:
      tags: [Noticias]
      summary: Obtener todas las noticias
      parameters:
        - in: query
          name: publicado
          schema:
            type: string
            enum: [true, false]
          description: Filtrar solo noticias publicadas
      responses:
        200:
          description: Lista de noticias

    post:
      tags: [Noticias]
      summary: Crear una noticia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoticiaBody"
      responses:
        201:
          description: Noticia creada con éxito
        400:
          description: titulo y contenido son requeridos

  /api/noticias/categorias:
    get:
      tags: [Noticias]
      summary: Obtener todas las categorías de noticias
      responses:
        200:
          description: Lista de categorías

  /api/noticias/{id}:
    get:
      tags: [Noticias]
      summary: Obtener una noticia por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Datos de la noticia
        404:
          description: Noticia no encontrada

    put:
      tags: [Noticias]
      summary: Actualizar una noticia
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoticiaBody"
      responses:
        200:
          description: Noticia actualizada con éxito

    delete:
      tags: [Noticias]
      summary: Eliminar una noticia (solo Administrador)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Noticia eliminada con éxito
        401:
          description: No autorizado
        404:
          description: Noticia no encontrada

  /api/noticias/usuario/{id_usuario}:
    get:
      tags: [Noticias]
      summary: Obtener noticias de un usuario específico
      parameters:
        - in: path
          name: id_usuario
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Lista de noticias del usuario
        400:
          description: ID de usuario inválido

  # ── Admin
  /api/admin/catalogos/inscripcion:
    get:
      tags: [Admin]
      summary: Obtener catálogos para el formulario de inscripción
      security:
        - bearerAuth: []
      responses:
        200:
          description: Catálogos (disciplinas, categorías, etc.)
        401:
          description: No autorizado

  /api/admin/deportistas/inscribir:
    post:
      tags: [Admin]
      summary: Inscribir un deportista
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscribirDeportistaBody"
      responses:
        201:
          description: Deportista inscrito correctamente
        400:
          description: Faltan datos o CI/correo ya registrado
        401:
          description: No autorizado

  /api/admin/roles:
    get:
      tags: [Admin]
      summary: Listar todos los roles del sistema
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de roles
        401:
          description: No autorizado

  /api/admin/usuarios/registrar:
    post:
      tags: [Admin]
      summary: Registrar un usuario desde el panel de admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearUsuarioBody"
      responses:
        201:
          description: Usuario registrado correctamente
        400:
          description: Faltan campos obligatorios o datos duplicados
        401:
          description: No autorizado

  /api/admin/carreras:
    get:
      tags: [Admin]
      summary: Listar todas las carreras
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de carreras
        401:
          description: No autorizado

  /api/admin/deportistas:
    get:
      tags: [Admin]
      summary: Listar todos los deportistas
      security:
        - bearerAuth: []
      responses:
        200:
          description: Lista de deportistas
        401:
          description: No autorizado

  # ── Upload
  /api/upload:
    post:
      tags: [Upload]
      summary: Subir imagen directo a OCI (portada)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imagen:
                  type: string
                  format: binary
      responses:
        200:
          description: URL pública de la imagen subida
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        400:
          description: No se proporcionó ninguna imagen

  /api/upload/temp:
    post:
      tags: [Upload]
      summary: Subir imagen temporal (mientras se redacta en el editor)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imagen:
                  type: string
                  format: binary
      responses:
        200:
          description: URL temporal de la imagen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 1
                  url:
                    type: string
                    example: /temp/temp-1234567890.webp
        400:
          description: No se proporcionó ninguna imagen

  # ── Partidos
  /api/partidos/recientes:
    get:
      tags: [Partidos]
      summary: Obtener resultados de partidos recientes
      responses:
        200:
          description: Lista de resultados recientes

  /api/partidos/fixture/{idTorneo}:
    get:
      tags: [Partidos]
      summary: Obtener el fixture de un torneo
      parameters:
        - in: path
          name: idTorneo
          required: true
          schema:
            type: integer
          description: ID del torneo
      responses:
        200:
          description: Fixture del torneo
        400:
          description: ID de torneo inválido

  /api/admin/horarios/entrenamiento:
    post:
      tags: [Admin]
      summary: Registrar un nuevo horario de entrenamiento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarHorarioBody"
      responses:
        201:
          description: Horario de entrenamiento registrado exitosamente
        400:
          description: Faltan campos obligatorios o día inválido
        401:
          description: No autorizado
        500:
          description: Error interno al guardar el horario

  /api/deportistas/destacados:
    get:
      tags: [Deportistas]
      summary: Obtener lista de jugadores destacados
      responses:
        200:
          description: Lista de jugadores destacados

  /api/galeria:
    get:
      tags: [Galeria]
      summary: Obtener la galería multimedia
      parameters:
        - in: query
          name: publicado
          schema:
            type: string
            enum: ["true", "false"]
          description: Filtrar solo elementos publicados
      responses:
        200:
          description: Lista de elementos de la galería
    post:
      tags: [Galeria]
      summary: Crear un elemento en la galería
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearGaleriaBody"
      responses:
        201:
          description: Elemento guardado en galería
        400:
          description: Faltan datos obligatorios

  /api/galeria/{id}:
    put:
      tags: [Galeria]
      summary: Actualizar un elemento de la galería
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearGaleriaBody"
      responses:
        200:
          description: Elemento actualizado
        404:
          description: Elemento no encontrado
    delete:
      tags: [Galeria]
      summary: Eliminar un elemento de la galería
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Elemento eliminado correctamente
        404:
          description: Elemento no encontrado

  /api/info/entrenadores:
    get:
      tags: [Info]
      summary: Obtener lista de entrenadores
      responses:
        200:
          description: Lista de entrenadores

  /api/info/horarios:
    get:
      tags: [Info]
      summary: Obtener horarios generales
      responses:
        200:
          description: Lista de horarios

  /api/info/galeria-eventos:
    get:
      tags: [Info]
      summary: Obtener galería de eventos del club
      responses:
        200:
          description: Galería de eventos

  /api/info/espacios:
    get:
      tags: [Info]
      summary: Obtener espacios deportivos disponibles
      responses:
        200:
          description: Lista de espacios

  /api/partidos/torneos:
    get:
      tags: [Partidos]
      summary: Listar todos los torneos
      responses:
        200:
          description: Lista de torneos

  /api/partidos/disciplinas:
    get:
      tags: [Partidos]
      summary: Listar todas las disciplinas deportivas
      responses:
        200:
          description: Lista de disciplinas

  /api/partidos/resultados:
    get:
      tags: [Partidos]
      summary: Obtener todos los resultados generales
      responses:
        200:
          description: Resultados generales

  /api/partidos/proximos:
    get:
      tags: [Partidos]
      summary: Obtener próximos partidos generales
      responses:
        200:
          description: Lista de próximos partidos

  /api/partidos/posiciones/{idTorneo}:
    get:
      tags: [Partidos]
      summary: Obtener la tabla de posiciones de un torneo
      parameters:
        - in: path
          name: idTorneo
          required: true
          schema:
            type: integer
        - in: query
          name: disciplina
          schema:
            type: integer
          description: Filtrar por ID de disciplina (opcional)
      responses:
        200:
          description: Tabla de posiciones
        400:
          description: ID de torneo inválido

  /api/partidos/torneo/{idTorneo}:
    get:
      tags: [Partidos]
      summary: Obtener todos los partidos de un torneo específico
      parameters:
        - in: path
          name: idTorneo
          required: true
          schema:
            type: integer
        - in: query
          name: disciplina
          schema:
            type: integer
          description: Filtrar por ID de disciplina (opcional)
      responses:
        200:
          description: Lista de partidos del torneo
        400:
          description: ID de torneo inválido

  /api/partidos/goleadores/{idTorneo}:
    get:
      tags: [Partidos]
      summary: Obtener tabla de goleadores de un torneo
      parameters:
        - in: path
          name: idTorneo
          required: true
          schema:
            type: integer
        - in: query
          name: disciplina
          schema:
            type: integer
      responses:
        200:
          description: Tabla de goleadores
        400:
          description: ID de torneo inválido

  /api/partidos/tarjetas/{idTorneo}:
    get:
      tags: [Partidos]
      summary: Obtener tabla de tarjetas de un torneo
      parameters:
        - in: path
          name: idTorneo
          required: true
          schema:
            type: integer
        - in: query
          name: disciplina
          schema:
            type: integer
      responses:
        200:
          description: Tabla de tarjetas
        400:
          description: ID de torneo inválido

  /api/admin/deportistas/{id}/estado:
    patch:
      tags: [Admin]
      summary: Cambiar o alternar el estado de un deportista
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del deportista al que se le cambiará el estado
      responses:
        200:
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Estado actualizado correctamente
                  nuevo_estado:
                    type: string
                    example: "Inactivo"
        400:
          description: ID de deportista inválido
        401:
          description: No autorizado (Token faltante, inválido o el usuario no es Administrador)
        404:
          description: No se encontraron inscripciones para este deportista
        500:
          description: Error interno del servidor al actualizar el estado
